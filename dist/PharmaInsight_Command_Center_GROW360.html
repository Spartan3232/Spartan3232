            <div class="flex gap-2 flex-shrink-0">
              <button data-click="w-goal-edit" data-id="${g.id}" class="text-xs text-blue-600 font-medium">Düzenle</button>
              <button data-click="w-goal-remove" data-id="${g.id}" class="text-red-500">${Icon('trash', 'w-4 h-4')}</button>
            </div>
          </div>`).join('')}
      </div>
      ${st.editingGoal ? _goalForm(st.editingGoal, session.observedCalls) : `
        <button data-click="w-goal-new" class="w-full flex items-center justify-center gap-2 py-3 border-2 border-dashed border-gray-300 dark:border-gray-700 rounded-xl text-gray-600 dark:text-gray-300 text-sm font-medium">${Icon('plus', 'w-4 h-4')} Yeni Gelişim Hedefi Ekle</button>
      `}
    </div>`;
};

const _goalForm = (draft, calls) => {
  const required = ['competencyId', 'currentState', 'targetBehavior', 'measurementMethod', 'dataSource', 'reviewDate', 'employeeCommitment', 'managerSupport'];
  const missing = required.filter(f => !String(draft[f] || '').trim());
  const stepsValid = draft.implementationSteps.some(s => s.trim());
  const canSave = missing.length === 0 && stepsValid;
  const isVague = VAGUE_PATTERNS.some(p => p.test(draft.targetBehavior || ''));
  return `
    <div class="bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-xl p-4 space-y-4">
      <div>
        <p class="text-xs font-medium text-gray-600 dark:text-gray-300 mb-2">Hazır şablonlar (seçtikten sonra tüm alanları gözden geçirin)</p>
        <div class="flex flex-wrap gap-2">
          ${CoachingEngine.GOAL_TEMPLATES.map(t => `<button data-click="w-goal-template" data-id="${t.id}" class="text-xs px-2.5 py-1.5 rounded-full border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-200">${Utils.escapeHtml(t.label)}</button>`).join('')}
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Yetkinlik *</label><input data-blur="w-goal-field" data-field="competencyId" value="${Utils.escapeHtml(draft.competencyId)}" placeholder="Örn. C9 veya field-continuity" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-sm" /></div>
        <div>
          <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Bağlı kanıtlar (görüşmeler)</label>
          <div class="flex flex-wrap gap-1.5">
            ${calls.length === 0 ? '<span class="text-xs text-gray-400 dark:text-gray-500">Görüşme yok</span>' : calls.map(c => `<button data-click="w-goal-toggle-evidence" data-call="${c.id}" class="text-xs px-2 py-1 rounded-full border ${draft.evidenceCallIds.includes(c.id) ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white dark:bg-gray-900 border-gray-300 dark:border-gray-700 text-gray-600 dark:text-gray-300'}">${Utils.escapeHtml(c.customerName)}</button>`).join('')}
          </div>
        </div>
      </div>
      <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Mevcut durum *</label><textarea data-blur="w-goal-field" data-field="currentState" rows="2" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-sm">${Utils.escapeHtml(draft.currentState)}</textarea></div>
      <div>
        <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Hedef davranış *</label>
        <textarea data-blur="w-goal-field" data-field="targetBehavior" rows="2" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-sm">${Utils.escapeHtml(draft.targetBehavior)}</textarea>
        ${isVague ? `<div class="flex items-center gap-1.5 text-xs text-amber-700 mt-1">${Icon('alertTriangle', 'w-3.5 h-3.5')} Bu hedef ölçülemez görünüyor ("daha iyi olacak" gibi). Somut, gözlenebilir bir davranış yazın.</div>` : ''}
      </div>
      <div>
        <div class="flex items-center justify-between mb-1"><label class="block text-xs font-medium text-gray-600 dark:text-gray-300">Uygulama adımları *</label><button data-click="w-goal-add-step" class="text-xs text-blue-600 font-medium flex items-center gap-1">${Icon('plus', 'w-3.5 h-3.5')} Adım ekle</button></div>
        <div class="space-y-1.5">
          ${draft.implementationSteps.map((s, i) => `
            <div class="flex items-center gap-2">
              <input data-blur="w-goal-step" data-idx="${i}" value="${Utils.escapeHtml(s)}" class="flex-1 px-2 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-sm" />
              <button data-click="w-goal-remove-step" data-idx="${i}" class="text-red-500">${Icon('x', 'w-4 h-4')}</button>
            </div>`).join('')}
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Başlangıç değeri</label><input data-blur="w-goal-field" data-field="baselineValue" value="${Utils.escapeHtml(draft.baselineValue ?? '')}" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-sm" /></div>
        <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Hedef değer</label><input data-blur="w-goal-field" data-field="targetValue" value="${Utils.escapeHtml(draft.targetValue ?? '')}" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-sm" /></div>
        <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Ölçüm birimi</label><input data-blur="w-goal-field" data-field="unit" value="${Utils.escapeHtml(draft.unit || '')}" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-sm" /></div>
      </div>
      <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Ölçüm yöntemi *</label><textarea data-blur="w-goal-field" data-field="measurementMethod" rows="2" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-sm">${Utils.escapeHtml(draft.measurementMethod)}</textarea></div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Veri kaynağı *</label><input data-blur="w-goal-field" data-field="dataSource" value="${Utils.escapeHtml(draft.dataSource)}" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-sm" /></div>
        <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Kontrol sıklığı</label><input data-blur="w-goal-field" data-field="checkFrequency" value="${Utils.escapeHtml(draft.checkFrequency || '')}" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-sm" /></div>
        <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Takip tarihi *</label><input type="date" data-blur="w-goal-field" data-field="reviewDate" value="${draft.reviewDate || ''}" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-sm" /></div>
      </div>
      <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Çalışanın taahhüdü *</label><textarea data-blur="w-goal-field" data-field="employeeCommitment" rows="2" placeholder="Çalışan kendi cümlesiyle ne yapacağını yazar." class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-sm">${Utils.escapeHtml(draft.employeeCommitment)}</textarea></div>
      <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Yönetici desteği *</label><textarea data-blur="w-goal-field" data-field="managerSupport" rows="2" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-sm">${Utils.escapeHtml(draft.managerSupport)}</textarea></div>
      <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Başarı kanıtı</label><input data-blur="w-goal-field" data-field="successEvidence" value="${Utils.escapeHtml(draft.successEvidence || '')}" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-sm" /></div>
      <div>
        <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Durum</label>
        <select data-change="w-goal-field" data-field="status" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-sm">
          ${Object.entries(CoachingEngine.GOAL_STATUS_LABELS).map(([k, v]) => `<option value="${k}" ${draft.status === k ? 'selected' : ''}>${v}</option>`).join('')}
        </select>
      </div>
      <div class="flex justify-end gap-2 pt-2 border-t border-gray-200 dark:border-gray-800">
        <button data-click="w-goal-cancel" class="px-4 py-2 border border-gray-300 dark:border-gray-700 text-gray-700 dark:text-gray-200 rounded-lg text-sm">İptal</button>
        <button data-click="w-goal-save" ${canSave ? '' : 'disabled'} class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm disabled:opacity-50">Hedefi Kaydet</button>
      </div>
    </div>`;
};

App.registerAction('w-goal-new', () => { Wizard.state.editingGoal = _emptyGoalDraft(); App.render(); });
App.registerAction('w-goal-edit', (ds) => {
  const g = Wizard.state.session.developmentGoals.find(x => x.id === ds.id);
  Wizard.state.editingGoal = JSON.parse(JSON.stringify(g));
  App.render();
});
App.registerAction('w-goal-cancel', () => { Wizard.state.editingGoal = null; App.render(); });
App.registerAction('w-goal-remove', (ds) => {
  const session = Wizard.state.session;
  Wizard.persist({ developmentGoals: session.developmentGoals.filter(g => g.id !== ds.id) });
  App.render();
});
App.registerAction('w-goal-template', (ds) => {
  const t = CoachingEngine.GOAL_TEMPLATES.find(x => x.id === ds.id);
  if (!t) return;
  const d = Wizard.state.editingGoal;
  Object.assign(d, {
    competencyId: t.competencyId, currentState: t.currentState, targetBehavior: t.targetBehavior,
    implementationSteps: [...t.implementationSteps], measurementMethod: t.measurementMethod,
    unit: t.unit, dataSource: t.dataSource, checkFrequency: t.checkFrequency,
  });
  App.render();
});
App.registerAction('w-goal-field', (ds, ev) => { Wizard.state.editingGoal[ds.field] = ev.target.value; App.render(); });
App.registerAction('w-goal-toggle-evidence', (ds) => {
  const d = Wizard.state.editingGoal;
  const has = d.evidenceCallIds.includes(ds.call);
  d.evidenceCallIds = has ? d.evidenceCallIds.filter(x => x !== ds.call) : [...d.evidenceCallIds, ds.call];
  App.render();
});
App.registerAction('w-goal-add-step', () => { Wizard.state.editingGoal.implementationSteps.push(''); App.render(); });
App.registerAction('w-goal-remove-step', (ds) => { Wizard.state.editingGoal.implementationSteps.splice(Number(ds.idx), 1); App.render(); });
App.registerAction('w-goal-step', (ds, ev) => { Wizard.state.editingGoal.implementationSteps[Number(ds.idx)] = ev.target.value; });

App.registerAction('w-goal-save', () => {
  const draft = Wizard.state.editingGoal;
  const result = CoachingEngine.createDevelopmentGoal(draft);
  if (!result.ok) { App.showToast(result.errors[0], 'error'); return; }
  const goal = { ...result.value, id: draft.id || result.value.id };
  const session = Wizard.state.session;
  const exists = session.developmentGoals.some(g => g.id === goal.id);
  const nextGoals = exists ? session.developmentGoals.map(g => g.id === goal.id ? goal : g) : [...session.developmentGoals, goal];
  if (Wizard.persist({ developmentGoals: nextGoals })) {
    Wizard.state.editingGoal = null;
    App.showToast('Hedef kaydedildi.', 'success');
  }
  App.render();
});
/* ============================================================
   ADIM 8 — Takip ve çıktı (Step8Followup.js karşılığı)
   ============================================================ */
Wizard.renderStep8 = (session, st) => {
  const checklist = _checklist(session);
  const hasAdvisory = (session.languageWarnings || []).some(w => w.severity === 'warn');
  const hasBlocking = (session.languageWarnings || []).some(w => w.severity === 'block');

  return `
    <div class="space-y-6">
      <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl p-4">
        <h4 class="font-semibold text-gray-900 dark:text-white mb-3 text-sm">Tamamlanma kontrolü</h4>
        <div class="space-y-2">
          ${checklist.map(c => `<div class="flex items-center gap-2 text-sm">${c.ok ? Icon('checkCircle', 'w-4 h-4 text-green-500 flex-shrink-0') : Icon('circle', 'w-4 h-4 text-gray-300 flex-shrink-0')}<span class="${c.ok ? 'text-gray-700 dark:text-gray-200' : 'text-gray-400 dark:text-gray-500'}">${c.label}</span></div>`).join('')}
        </div>
      </div>

      ${session.languageWarnings?.length ? `
        <div class="bg-amber-50 dark:bg-amber-950/40 border border-amber-200 rounded-xl p-4 space-y-2">
          <h4 class="font-semibold text-amber-900 text-sm flex items-center gap-1.5">${Icon('alertTriangle', 'w-4 h-4')} Dil kontrolü uyarıları</h4>
          ${session.languageWarnings.map(w => `<div class="text-xs px-2 py-1.5 rounded-lg ${w.severity === 'block' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-800'}"><strong>${Utils.escapeHtml(w.field)}:</strong> "${Utils.escapeHtml(w.term)}" — ${Utils.escapeHtml(w.guidance)}</div>`).join('')}
          ${(hasAdvisory && !hasBlocking) ? `
            <label class="flex items-center gap-2 text-xs text-amber-900 mt-2">
              <input type="checkbox" id="w-ack-warnings" ${st.ackWarnings ? 'checked' : ''} data-change="w-toggle-ack" />
              Metni gözden geçirdim; bu ifadelerin uygun olduğunu onaylıyorum.
            </label>` : ''}
        </div>` : ''}

      <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl p-4">
        <div class="flex items-center justify-between mb-3">
          <h4 class="font-semibold text-gray-900 dark:text-white text-sm">Otomatik SFA yorumu</h4>
          <button data-click="w-generate-comment" class="text-xs text-blue-600 font-medium flex items-center gap-1">${Icon('sparkles', 'w-3.5 h-3.5')} Yorumu Oluştur</button>
        </div>
        ${st.comment ? `<p class="text-sm text-gray-700 dark:text-gray-200 whitespace-pre-line">${Utils.escapeHtml(st.comment)}</p>` : `<p class="text-xs text-gray-400 dark:text-gray-500">Yalnızca kayıtlı veri ve kanıt kullanılarak yerel kural motoruyla üretilir; harici AI kullanılmaz.</p>`}
      </div>

      <div class="flex flex-wrap gap-3">
        <button data-click="w-download-json" class="flex items-center gap-2 px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg text-sm text-gray-700 dark:text-gray-200">${Icon('download', 'w-4 h-4')} JSON indir</button>
        <button data-click="w-download-csv" class="flex items-center gap-2 px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg text-sm text-gray-700 dark:text-gray-200">${Icon('download', 'w-4 h-4')} CSV indir</button>
        <button data-click="w-print" class="flex items-center gap-2 px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg text-sm text-gray-700 dark:text-gray-200">${Icon('printer', 'w-4 h-4')} Yazdır / PDF</button>
      </div>

      ${st.completionErrors.length ? `
        <div class="bg-red-50 dark:bg-red-950/40 border border-red-200 rounded-xl p-4">
          <h4 class="font-semibold text-red-800 text-sm mb-2">Koçluk tamamlanamadı</h4>
          <ul class="list-disc list-inside text-sm text-red-700 space-y-1">${st.completionErrors.map(e => `<li>${Utils.escapeHtml(e)}</li>`).join('')}</ul>
        </div>` : ''}

      <button data-click="w-complete" ${session.status === 'completed' ? 'disabled' : ''} class="w-full py-3 bg-gradient-to-r from-green-500 to-teal-600 text-white rounded-xl font-semibold disabled:opacity-50">
        ${session.status === 'completed' ? 'Koçluk tamamlandı' : 'Koçluğu Tamamla'}
      </button>
    </div>`;
};

App.registerAction('w-toggle-ack', (ds, ev) => { Wizard.state.ackWarnings = ev.target.checked; });

App.registerAction('w-generate-comment', () => {
  Wizard.state.comment = CoachingEngine.buildSfaComment(Wizard.state.session);
  App.render();
});

App.registerAction('w-download-json', () => {
  Utils.downloadBlob(JSON.stringify(Wizard.state.session, null, 2), `coaching_${Wizard.state.session.id}.json`, 'application/json');
});
App.registerAction('w-download-csv', () => {
  Utils.downloadBlob(CoachingEngine.buildCsv(Wizard.state.session), `coaching_${Wizard.state.session.id}.csv`, 'text/csv;charset=utf-8');
});
App.registerAction('w-print', () => window.print());

App.registerAction('w-complete', () => {
  const st = Wizard.state;
  const res = CoachingEngine.completeSession(st.session.id, { actor: App.state.currentUser.name, acknowledgeWarnings: st.ackWarnings });
  if (!res.ok) {
    st.completionErrors = res.errors;
    st.session = { ...st.session, languageWarnings: res.languageWarnings || st.session.languageWarnings };
    App.render();
    return;
  }
  st.session = res.value;
  st.completionErrors = [];
  App.showToast('Koçluk tamamlandı.', 'success');
  App.render();
});
/* ============================================================
   BOOTSTRAP — sayfa yüklendiğinde uygulamayı başlatır.
   ============================================================ */
(function bootstrap() {
  const start = () => {
    App.init();
    const s = Store.get();
    if (s.currentUserId) {
      const u = s.users.find(x => x.id === s.currentUserId);
      if (u) { App.state.currentUser = u; App.state.route = 'dashboard'; App.render(); }
    }
  };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();

</script>
</body>
</html>
