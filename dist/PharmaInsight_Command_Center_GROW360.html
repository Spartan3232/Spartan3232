<script>
/* ============================================================
   GLOBAL EKRAN KAYITLARI — her ekran/wizard dosyası bu nesnelere
   kendi metodlarını ekler (Screens.dashboard = () => {...} gibi).
   Böylece dosya sırası (Screens/Wizard tanımı hariç) önemli olmaz.
   ============================================================ */
const Screens = {};
const Wizard = {};

/* ============================================================
   UTILS — ortak yardımcı fonksiyonlar
   ============================================================ */
const Utils = (() => {
  const uid = () => 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);

  const nowIso = () => new Date().toISOString();

  const escapeHtml = (str) => {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  };

  const formatDateTR = (isoDate) => {
    if (!isoDate) return '';
    try {
      const d = new Date(isoDate.length === 10 ? isoDate + 'T00:00:00' : isoDate);
      return d.toLocaleDateString('tr-TR');
    } catch (e) { return isoDate; }
  };

  const formatDateTimeTR = (isoDateTime) => {
    if (!isoDateTime) return '';
    try {
      const d = new Date(isoDateTime);
      return d.toLocaleString('tr-TR');
    } catch (e) { return isoDateTime; }
  };

  const todayIso = () => new Date().toISOString().slice(0, 10);

  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

  const debounce = (fn, ms) => {
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), ms);
    };
  };

  const downloadBlob = (content, filename, mime) => {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const readFileAsText = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsText(file, 'utf-8');
  });

  const csvCell = (value) => {
    const s = value === null || value === undefined ? '' : String(value);
    if (/[;"\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  };

  const toCsvRow = (arr) => arr.map(csvCell).join(';');

  return {
    uid, nowIso, escapeHtml, formatDateTR, formatDateTimeTR, todayIso, clamp,
    debounce, downloadBlob, readFileAsText, toCsvRow,
  };
})();
/* ============================================================
   STORE — tek localStorage anahtarı üzerinde kalıcı uygulama durumu
   Backend/MongoDB'nin yerini alır. Hiçbir ağ çağrısı yapmaz.
   ============================================================ */
const Store = (() => {
  const STORAGE_KEY = 'pharmainsight_command_center_v1';

  const emptyState = () => ({
    schemaVersion: '1.0',
    users: [],
    currentUserId: null,
    coachingSessions: [],
    goals: [],
    rotaSessions: [],
    assessments: [],
    settings: { aiApiKey: null, aiProvider: 'openai', theme: null },
  });

  let state = null;

  const load = () => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        state = JSON.parse(raw);
        return state;
      }
    } catch (e) {
      console.error('Store: localStorage okunamadı, sıfırlanıyor.', e);
    }
    // localStorage boşsa, dosyanın içine gömülü örnek veri var mı bak (self-export'tan gelen dosya)
    if (window.__SEED_DATA__) {
      try {
        state = JSON.parse(JSON.stringify(window.__SEED_DATA__));
        persist();
        return state;
      } catch (e) {
        console.error('Store: gömülü veri okunamadı.', e);
      }
    }
    state = emptyState();
    persist();
    return state;
  };

  const persist = () => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return true;
    } catch (e) {
      console.error('Store: localStorage yazılamadı (kota dolu olabilir).', e);
      return false;
    }
  };

  const get = () => {
    if (!state) load();
    return state;
  };

  const set = (updater) => {
    const s = get();
    const next = typeof updater === 'function' ? updater(s) : { ...s, ...updater };
    state = next;
    persist();
    return state;
  };

  const reset = () => {
    state = emptyState();
    persist();
    return state;
  };

  const exportAll = () => JSON.stringify(get(), null, 2);

  const importAll = (jsonText) => {
    const parsed = JSON.parse(jsonText);
    if (!parsed || typeof parsed !== 'object') throw new Error('Geçersiz JSON');
    state = { ...emptyState(), ...parsed };
    persist();
    return state;
  };

  return { get, set, load, persist, reset, exportAll, importAll, STORAGE_KEY };
})();

  const classificationForScore = (score) => {

    if (score <= 2) return 'development';
    if (score === 3) return 'expected';
    return 'strength';
  };

  /* Kritik iş kuralı — CompetencyRating.model_validator'ın birebir portu:
     - status not_assessed/not_observed veya score yok -> not_assessed, score null
     - score 1/2/4/5 ise evidenceNote VE evidenceCallIds zorunlu
     - 3 puan kanıt istemez, "expected" olur; gelişim alanına asla girmez
     - boş kriter otomatik 3 yapılmaz (varsayılan zaten not_assessed) */
  const createCompetencyRating = (data) => {
    const errors = [];
    if (!COMPETENCY_IDS.has(data.criterionId)) errors.push(`Bilinmeyen yetkinlik kriteri: ${data.criterionId}`);
    let status = data.status || 'not_assessed';
    let score = data.score === undefined || data.score === null || data.score === '' ? null : Number(data.score);
    if (status === 'not_assessed' || status === 'not_observed' || score === null) {
      score = null;
      if (errors.length) return { ok: false, errors };
      return { ok: true, value: { criterionId: data.criterionId, score: null, status, evidenceCallIds: data.evidenceCallIds || [], evidenceNote: data.evidenceNote || null, classification: 'not_assessed' } };
    }
    if ([1, 2, 4, 5].includes(score)) {
      const hasNote = data.evidenceNote && data.evidenceNote.trim();
      const hasEvidence = data.evidenceCallIds && data.evidenceCallIds.length > 0;
      if (!hasNote) errors.push(`${data.criterionId}: ${score} puan somut kanıt notu olmadan kaydedilemez.`);
      if (!hasEvidence) errors.push(`${data.criterionId}: ${score} puan en az bir görüşme kanıtına bağlanmadan kaydedilemez.`);
    }
    if (errors.length) return { ok: false, errors };
    const classification = classificationForScore(score);
    return { ok: true, value: { criterionId: data.criterionId, score, status, evidenceCallIds: data.evidenceCallIds || [], evidenceNote: data.evidenceNote || null, classification } };
  };

    if (steps.length === 0) errors.push('En az bir uygulama adımı zorunludur.');
    if (errors.length) return { ok: false, errors };
    return {
      ok: true,
      value: {
        id: data.id || Utils.uid(),
        competencyId: data.competencyId,
        currentState: data.currentState.trim(),
        evidenceCallIds: data.evidenceCallIds || [],
        targetBehavior: data.targetBehavior.trim(),
        implementationSteps: steps,

        dataSource: data.dataSource.trim(),
        checkFrequency: data.checkFrequency || null,
        reviewDate: data.reviewDate,
        employeeCommitment: data.employeeCommitment.trim(),
        managerSupport: data.managerSupport.trim(),
        successEvidence: data.successEvidence || null,
        status: data.status || 'planned',
      },
    };
  };

  const makeEmployeeReflection = (data) => ({ whatWentWell: data?.whatWentWell || null, whatWasDifficult: data?.whatWasDifficult || null, chosenFocus: data?.chosenFocus || null, employeeStatement: data?.employeeStatement || null });
  const makeGrowConversation = (data) => ({ goal: data?.goal || null, reality: data?.reality || null, options: data?.options || [], wayForward: data?.wayForward || null });

  const createCoachingSession = (data) => ({
    schemaVersion: SCHEMA_VERSION,
    id: data.id || Utils.uid(),
    representative: data.representative,
    manager: data.manager,
    sessionDate: data.sessionDate,
    sessionType: data.sessionType,
    status: data.status || 'draft',
    province: data.province || null,
    bricks: data.bricks || [],
    focusCompetencies: data.focusCompetencies || [],
    previousSessionId: data.previousSessionId || null,
    fieldDayStart: data.fieldDayStart || '',
    fieldDayEnd: data.fieldDayEnd || '',
    contextMetrics: data.contextMetrics || buildContextMetrics(),
    observedCalls: data.observedCalls || [],
    noCallsJustification: data.noCallsJustification || null,
    competencyRatings: data.competencyRatings || [],
    employeeReflection: makeEmployeeReflection(data.employeeReflection),
    growConversation: makeGrowConversation(data.growConversation),
    developmentGoals: data.developmentGoals || [],
    followUps: data.followUps || [],
    languageWarnings: data.languageWarnings || [],
    auditLog: data.auditLog || [],
  });

  /* ---------- Dil taraması (tüm oturum) ---------- */
  const scanSessionLanguage = (session) => {
    const warnings = [];
    const scan = (field, text) => { checkLanguage(text).forEach(hit => warnings.push({ field, term: hit.term, severity: hit.severity, guidance: hit.guidance })); };
    session.observedCalls.forEach(c => { scan(`observedCalls[${c.id}].observationNote`, c.observationNote); scan(`observedCalls[${c.id}].commitment`, c.commitment); });
    session.competencyRatings.forEach(r => scan(`competencyRatings[${r.criterionId}].evidenceNote`, r.evidenceNote));
    scan('employeeReflection.whatWentWell', session.employeeReflection.whatWentWell);
    scan('employeeReflection.whatWasDifficult', session.employeeReflection.whatWasDifficult);
    scan('employeeReflection.chosenFocus', session.employeeReflection.chosenFocus);
    scan('employeeReflection.employeeStatement', session.employeeReflection.employeeStatement);
    scan('growConversation.goal', session.growConversation.goal);
    scan('growConversation.reality', session.growConversation.reality);
    scan('growConversation.wayForward', session.growConversation.wayForward);
    (session.growConversation.options || []).forEach((opt, i) => scan(`growConversation.options[${i}]`, opt));
    session.developmentGoals.forEach(g => {
      scan(`developmentGoals[${g.id}].currentState`, g.currentState);
      scan(`developmentGoals[${g.id}].targetBehavior`, g.targetBehavior);
      scan(`developmentGoals[${g.id}].employeeCommitment`, g.employeeCommitment);
      scan(`developmentGoals[${g.id}].managerSupport`, g.managerSupport);
    });
    return warnings;
  };

  const labelFor = (criterionId) => (COMPETENCY_CRITERIA.find(c => c.id === criterionId) || {}).label || criterionId;

  /* Yerel kural motoru — harici AI kullanmadan, docs/COACHING_ENGINE_SPEC.md bölüm 12
     sırasıyla (kapsam -> güçlü yönler -> gelişim alanları -> ticari bağlam uyarısı ->
     çalışan görüşü -> hedef davranış) SFA yorumu üretir. */
  const buildSfaComment = (session) => {
    const parts = [];
    const customers = new Set(session.observedCalls.map(c => c.customerName));
    const bricks = Array.from(new Set([...(session.bricks || []), ...session.observedCalls.map(c => c.brick).filter(Boolean)]));
    let scope = `${session.sessionDate} tarihinde `;
    if (bricks.length) scope += `${bricks.join(', ')} bölgesinde `;
    scope += `${session.observedCalls.length} görüşme gözlemlenmiştir`;
    scope += customers.size ? ` (${customers.size} farklı müşteri).` : '.';
    parts.push(scope);

    const strengths = session.competencyRatings.filter(r => r.classification === 'strength');
    if (strengths.length) parts.push(`Gözlenen güçlü yönler: ${strengths.map(r => `${labelFor(r.criterionId)} — ${r.evidenceNote}`).join('; ')}.`);

    const developments = session.competencyRatings.filter(r => r.classification === 'development');
    if (developments.length) parts.push(`Gelişim alanları: ${developments.map(r => `${labelFor(r.criterionId)} — ${r.evidenceNote}`).join('; ')}.`);

    if (session.contextMetrics.some(m => m.status === 'missing')) {
      parts.push('Ticari/saha veri bağlamı: IMS/pazar/ziyaret veri kaynağı bu koçluğa bağlı olmadığından, ticari sonuçlarla yetkinlik arasında herhangi bir nedensellik kurulmamıştır.');
    }

    const reflection = session.employeeReflection.employeeStatement || session.employeeReflection.chosenFocus;
    if (reflection) parts.push(`Çalışanın görüşü: ${reflection}`);

    if (session.developmentGoals.length) {
      const g = session.developmentGoals[0];
      parts.push(`Üzerinde uzlaşılan hedef davranış: ${g.targetBehavior} Ölçüm: ${g.measurementMethod} Takip tarihi: ${g.reviewDate}. Yönetici desteği: ${g.managerSupport}`);
    }
    return parts.join(' ');
  };

  const buildCsv = (session) => {
    const rows = [];
    rows.push(['Bölüm: Gözlenen Görüşmeler']);
    rows.push(['Tarih', 'Müşteri', 'Tip', 'Branş', 'Ünite', 'Brick', 'Planlı', 'Süre (dk)', 'Açık Soru', 'Kapalı Soru', 'Probe Soru', 'Taahhüt', 'Sonraki Adım', 'Takip Tarihi', 'Gözlem Notu']);
    session.observedCalls.forEach(c => {
      const planned = c.planned === true ? 'Evet' : (c.planned === false ? 'Hayır' : '');
      rows.push([c.visitDateTime || '', c.customerName, c.customerType, c.branch || '', c.unit || '', c.brick, planned, c.durationMinutes ?? '', c.openQuestionCount, c.closedQuestionCount, c.probeQuestionCount, c.commitment || '', c.nextStep || '', c.followUpDate || '', c.observationNote]);
    });
    rows.push([]);
    rows.push(['Bölüm: Gelişim Hedefleri']);
    rows.push(['Yetkinlik', 'Mevcut Durum', 'Hedef Davranış', 'Ölçüm Yöntemi', 'Veri Kaynağı', 'Takip Tarihi', 'Çalışan Taahhüdü', 'Yönetici Desteği', 'Durum']);
    session.developmentGoals.forEach(g => {
      rows.push([g.competencyId, g.currentState, g.targetBehavior, g.measurementMethod, g.dataSource, g.reviewDate, g.employeeCommitment, g.managerSupport, g.status]);
    });
    return '﻿' + rows.map(Utils.toCsvRow).join('\n');
  };

  /* ---------- Store tabanlı CRUD (backend route'larının yerini alır) ---------- */

  const getSessions = () => Store.get().coachingSessions;

  const saveSessionToStore = (session) => {
    Store.set(s => {
      const idx = s.coachingSessions.findIndex(x => x.id === session.id);
      const next = [...s.coachingSessions];
      if (idx >= 0) next[idx] = session; else next.push(session);
      return { ...s, coachingSessions: next };
    });
    return session;
  };

  const createSession = (setup, actor) => {
    const session = createCoachingSession({
      representative: setup.representative,
      manager: setup.manager,
      sessionDate: setup.sessionDate,
      sessionType: setup.sessionType,
      province: setup.province,
      bricks: setup.bricks,
      focusCompetencies: setup.focusCompetencies,
      previousSessionId: setup.previousSessionId,
      fieldDayStart: setup.fieldDayStart,
      fieldDayEnd: setup.fieldDayEnd,
    });
    session.auditLog.push({ timestamp: Utils.nowIso(), action: 'created', actor: actor || null });
    return saveSessionToStore(session);
  };

  const getSession = (id) => getSessions().find(s => s.id === id) || null;

  const listSessions = (viewerId, viewerRole, representativeId) => {
    const isManager = ['coach', 'manager', 'bolge_muduru'].includes(viewerRole);
    return getSessions().filter(s => {
      if (!isManager) return s.representative?.id === viewerId;
      if (representativeId) return s.representative?.id === representativeId;
      return (s.manager?.id === viewerId) || (s.representative?.id === viewerId);
    });
  };

  /* update_session route'unun portu: gelen alanları birleştirir, dil taramasını
     yeniden çalıştırır, audit log'a işler. Hata durumunda {ok:false, errors} döner. */
  const updateSession = (id, patch, actor) => {
    const existing = getSession(id);
    if (!existing) return { ok: false, errors: ['Koçluk kaydı bulunamadı.'] };
    const merged = { ...existing, ...patch };
    // competencyRatings/observedCalls/developmentGoals alanları zaten önceden
    // create*() fabrikalarıyla doğrulanmış olarak geliyor (UI katmanında).
    const session = createCoachingSession(merged);
    session.id = existing.id;
    session.auditLog = [...existing.auditLog, { timestamp: Utils.nowIso(), action: 'updated', actor: actor || null, details: { fields: Object.keys(patch) } }];
    session.languageWarnings = scanSessionLanguage(session);
    saveSessionToStore(session);
    return { ok: true, value: session };
  };

  /* complete_session route'unun birebir portu: tamamlanma koşullarının hepsini
     kontrol eder; disiplin dili her zaman engeller, kişisel/özel hayat dili
     onaylanmadıkça engeller. */
  const completeSession = (id, opts) => {
    const session = getSession(id);
    if (!session) return { ok: false, errors: ['Koçluk kaydı bulunamadı.'] };
    const warnings = scanSessionLanguage(session);
    const blocking = warnings.filter(w => w.severity === 'block');
    const advisory = warnings.filter(w => w.severity === 'warn');
    const errors = [];

    if (blocking.length) {
      errors.push('Kayıtta disiplin/fesih diline ait ifadeler var; koçluk kaydı bu haliyle tamamlanamaz. İlgili metni kaldırın: ' + Array.from(new Set(blocking.map(w => w.term))).join('; '));
    }
    if (advisory.length && !opts?.acknowledgeWarnings) {
      errors.push('Kayıtta kişilik/özel hayata ilişkin ifade olabilecek terimler var. Metni role ilişkin somut davranışla yeniden yazın veya bilerek onaylayın: ' + Array.from(new Set(advisory.map(w => w.term))).join('; '));
    }
    if (!session.observedCalls.length && !(session.noCallsJustification || '').trim()) {
      errors.push('En az bir gözlenen görüşme veya gerekçeli görüşmesiz koçluk türü açıklaması gereklidir.');
    }
    if (!session.competencyRatings.length || session.competencyRatings.every(r => r.status === 'not_assessed')) {
      errors.push('En az bir yetkinlik kriteri değerlendirilmelidir.');
    }
    session.competencyRatings.forEach(r => {
      if ([1, 2, 4, 5].includes(r.score) && !(r.evidenceNote && r.evidenceCallIds && r.evidenceCallIds.length)) {
        errors.push(`${r.criterionId}: ${r.score} puan kanıtsız tamamlanamaz.`);
      }
    });
    const refl = session.employeeReflection;
    if (!(refl.whatWentWell || refl.whatWasDifficult || refl.chosenFocus || refl.employeeStatement)) {
      errors.push('En az bir çalışan öz değerlendirme alanı doldurulmalıdır.');
    }
    if (!session.developmentGoals.length) errors.push('En az bir gelişim veya güçlü yön hedefi gereklidir.');

    if (errors.length) return { ok: false, errors, languageWarnings: warnings };

    session.status = 'completed';
    session.languageWarnings = warnings;
    session.auditLog.push({ timestamp: Utils.nowIso(), action: 'completed', actor: opts?.actor || null, details: { acknowledgedWarnings: !!(opts?.acknowledgeWarnings && advisory.length) } });
    saveSessionToStore(session);
    return { ok: true, value: session };
  };

  return {
    SCHEMA_VERSION, COMPETENCY_CATEGORIES, COMPETENCY_CRITERIA, COMPETENCY_IDS, SCORE_SCALE,
    SESSION_TYPE_LABELS, CUSTOMER_TYPE_LABELS, RATING_STATUS_LABELS, CLASSIFICATION_LABELS, GOAL_STATUS_LABELS,
    GOAL_TEMPLATES, CONTEXT_METRIC_DEFS, NO_DATA_SOURCE, FORBIDDEN_TERMS,
    checkLanguage, buildContextMetrics, classificationForScore,
    createObservedCall, createCompetencyRating, createDevelopmentGoal, createCoachingSession,
    makeSpinStage, makeSpinRecord, makePresentation,
    scanSessionLanguage, labelFor, buildSfaComment, buildCsv,
    createSession, getSession, listSessions, updateSession, completeSession,
  };
})();

const COACHING_AREAS = CoachingEngine.COMPETENCY_CATEGORIES.reduce((acc, cat) => {
  const skills = CoachingEngine.COMPETENCY_CRITERIA.filter(c => c.category === cat.id).map(c => c.label);
  acc[cat.label] = {
    description: `Yetkinlik kategorisi ${cat.id}: ${cat.label}`,
    key_skills: skills,
    product_specific: false,
    branch_specific: false,
  };
  return acc;
}, {});
/* ============================================================
   RECORDS — Temsilci/Brick/Doktor/Eczane kayıtlarını, gerçekten
   girilmiş veriden (coachingSessions.observedCalls) türetir.
   Ayrı bir doktor/eczane/brick "ana verisi" (havuz) bu depoda hiç
   yoktu — burada hiçbir sayı uydurulmuyor; yalnızca zaten kaydedilmiş
   ziyaret/koçluk verisinden gerçek bir liste kuruluyor. Hiç görüşme
   girilmemiş bir doktor/eczane/brick listede görünmez (uydurma yok).
   ============================================================ */
const Records = (() => {
  const allSessions = () => Store.get().coachingSessions;
  const allCalls = () => allSessions().flatMap(s => (s.observedCalls || []).map(c => ({ ...c, sessionId: s.id, representative: s.representative, sessionStatus: s.status })));

  const customerKey = (name, brick) => `${(name || '').trim().toLowerCase()}|${(brick || '').trim().toLowerCase()}`;

  const temsilciler = () => {
    const users = Store.get().users.filter(u => u.role !== 'coach');
    return users.map(u => {
      const sessions = allSessions().filter(s => s.representative?.id === u.id);
      const calls = allCalls().filter(c => c.representative?.id === u.id);
      return {
        kind: 'temsilci', id: u.id, name: u.name, email: u.email,
        sessionCount: sessions.length, callCount: calls.length,
        lastActivity: [...sessions].sort((a, b) => (b.sessionDate || '').localeCompare(a.sessionDate || ''))[0]?.sessionDate || null,
      };
    });
  };

  const brickler = () => {
    const map = new Map();
    allSessions().forEach(s => (s.bricks || []).forEach(b => {
      if (!map.has(b)) map.set(b, { kind: 'brick', id: b, name: b, sessionCount: 0, callCount: 0 });
      map.get(b).sessionCount += 1;
    }));
    allCalls().forEach(c => {
      if (!c.brick) return;
      if (!map.has(c.brick)) map.set(c.brick, { kind: 'brick', id: c.brick, name: c.brick, sessionCount: 0, callCount: 0 });
      map.get(c.brick).callCount += 1;
    });
    return Array.from(map.values());
  };

  const musteriler = (customerType) => {
    const map = new Map();
    allCalls().filter(c => c.customerType === customerType).forEach(c => {
      const key = customerKey(c.customerName, c.brick);
      if (!map.has(key)) {
        map.set(key, {
          kind: customerType, id: key, name: c.customerName, branch: c.branch, unit: c.unit, brick: c.brick,
          visitCount: 0, lastVisit: null, reps: new Set(),
        });
      }
      const rec = map.get(key);
      rec.visitCount += 1;
      if (c.visitDateTime && (!rec.lastVisit || c.visitDateTime > rec.lastVisit)) rec.lastVisit = c.visitDateTime;
      if (c.representative?.id) rec.reps.add(c.representative.name);
    });
    return Array.from(map.values()).map(r => ({ ...r, reps: Array.from(r.reps) }));
  };

  const doktorlar = () => musteriler('doctor');
  const eczaneler = () => musteriler('pharmacy');

  /* Bir kayıt için ortak 360° detay: ziyaretler, ürün odağı dağılımı, ilişkili
     müşteri/temsilciler ve bu ziyaretlere bağlı koçluk kanıtları. */
  const detailFor = (kind, id) => {
    let calls = [];
    let sessions = [];
    let relatedLabel = 'İlişkili';
    let related = [];

    if (kind === 'temsilci') {
      sessions = allSessions().filter(s => s.representative?.id === id);
      calls = allCalls().filter(c => c.representative?.id === id);
      relatedLabel = 'Ziyaret edilen müşteriler';
      const seen = new Map();
      calls.forEach(c => {
        const k = customerKey(c.customerName, c.brick);
        if (!seen.has(k)) seen.set(k, { name: c.customerName, brick: c.brick, type: c.customerType, count: 0 });
        seen.get(k).count += 1;
      });
      related = Array.from(seen.values());
    } else if (kind === 'brick') {
      sessions = allSessions().filter(s => (s.bricks || []).includes(id));
      calls = allCalls().filter(c => c.brick === id);
      relatedLabel = 'Bu brickte çalışan temsilciler';
      const seen = new Map();
      calls.forEach(c => { if (c.representative) seen.set(c.representative.id, c.representative.name); });
      related = Array.from(seen.entries()).map(([repId, name]) => ({ id: repId, name }));
    } else {
      // doctor / pharmacy — id "name|brick" anahtarı
      calls = allCalls().filter(c => c.customerType === kind && customerKey(c.customerName, c.brick) === id);
      const sessionIds = new Set(calls.map(c => c.sessionId));
      sessions = allSessions().filter(s => sessionIds.has(s.id));
      relatedLabel = 'Ziyaret eden temsilciler';
      const seen = new Map();
      calls.forEach(c => { if (c.representative) seen.set(c.representative.id, c.representative.name); });
      related = Array.from(seen.entries()).map(([repId, name]) => ({ id: repId, name }));
    }

    const products = {};
    calls.forEach(c => { if (c.productFocus) products[c.productFocus] = (products[c.productFocus] || 0) + 1; });

    // Bu kayda ait görüşmelerde kanıt gösterilen yetkinlik değerlendirmeleri
    const callIds = new Set(calls.map(c => c.id));
    const competencyEvidence = [];
    sessions.forEach(s => (s.competencyRatings || []).forEach(r => {
      if ((r.evidenceCallIds || []).some(cid => callIds.has(cid))) {
        competencyEvidence.push({ ...r, sessionId: s.id, representative: s.representative });
      }
    }));

    return { calls, sessions, products, related, relatedLabel, competencyEvidence };
  };

  return { temsilciler, brickler, doktorlar, eczaneler, detailFor, customerKey, allCalls, allSessions };
})();

  mapPin: 'M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z M12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z',
};

function Icon(name, cls) {
  const path = ICONS[name] || ICONS.circle;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls || 'w-5 h-5'}">${path.split(' M').map((seg, i) => `<path d="${i === 0 ? seg : 'M' + seg}"/>`).join('')}</svg>`;
}
/* ============================================================
   APP SHELL — iPadOS tarzı 3 panel çerçeve: sol sabit modül menüsü,
   üstte arama/dönem/filtre çubuğu, ortada kayıt listesi, sağda 360°
   detay. GROW 360 sihirbazı, seçili temsilcinin "Koçluk" sekmesinden
   sağdan kayan tam ekran bir panel olarak açılır.
   ============================================================ */
const App = (() => {
  const state = {
    currentUser: null,
    leftSection: 'dashboard',
    selectedRecordKind: null,
    selectedRecordId: null,
    activeTab: 'performans',
    search: '',
    period: 'all',
    onlyCompleted: false,
    wizardOpen: false,
    toast: null,
  };

  const Actions = {};
  const registerAction = (name, fn) => { Actions[name] = fn; };
  const root = () => document.getElementById('root');

  const showToast = (message, kind) => {
    state.toast = { message, kind: kind || 'info' };
    renderToast();
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => { state.toast = null; renderToast(); }, 3500);
  };
  const renderToast = () => {
    const el = document.getElementById('toast-root');
    if (!el) return;
    if (!state.toast) { el.innerHTML = ''; return; }
    const colors = { info: 'bg-gray-900 dark:bg-gray-100 dark:text-gray-900', success: 'bg-green-600', error: 'bg-red-600' };
    el.innerHTML = `<div class="fixed bottom-4 right-4 z-[200] ${colors[state.toast.kind] || colors.info} text-white text-sm px-4 py-2.5 rounded-xl shadow-lg">${Utils.escapeHtml(state.toast.message)}</div>`;
  };

  const SIDEBAR_GROUPS = [
    { label: 'Genel', items: [{ key: 'dashboard', label: 'Özet', icon: 'home' }] },
    { label: 'Kayıtlar', items: [
      { key: 'temsilciler', label: 'Temsilciler', icon: 'users' },
      { key: 'doktorlar', label: 'Doktorlar', icon: 'stethoscope' },
      { key: 'eczaneler', label: 'Eczaneler', icon: 'building' },
      { key: 'brickler', label: 'Brickler', icon: 'mapPin' },
    ] },
    { label: 'Araçlar', items: [
      { key: 'ai-coach', label: 'AI Koç', icon: 'brain' },
      { key: 'assessments', label: 'Değerlendirmeler', icon: 'award' },
      { key: 'goals', label: 'Hedeflerim', icon: 'target' },
    ] },
    { label: 'Sistem', items: [{ key: 'settings', label: 'Ayarlar', icon: 'settings' }] },
  ];
  const RECORD_SECTIONS = { temsilciler: 'temsilci', doktorlar: 'doctor', eczaneler: 'pharmacy', brickler: 'brick' };
  const SECTION_LABELS = { temsilciler: 'Temsilciler', doktorlar: 'Doktorlar', eczaneler: 'Eczaneler', brickler: 'Brickler' };

  const currentTheme = () => document.documentElement.classList.contains('dark') ? 'dark' : 'light';

  /* ---------- Üst çubuk ---------- */
  const renderTopBar = () => {
    const isRecordSection = !!RECORD_SECTIONS[state.leftSection];
    const theme = currentTheme();
    return `
      <div class="h-14 flex-shrink-0 flex items-center gap-3 px-4 border-b hairline bg-white/80 dark:bg-gray-900/80 ios-blur overflow-x-auto overflow-y-hidden">
        <button data-click="toggle-sidebar" class="md:hidden flex-shrink-0 p-1.5 -ml-1 text-gray-600 dark:text-gray-300">${Icon('slidersHorizontal', 'w-5 h-5')}</button>
        ${isRecordSection ? `
          <div class="relative flex-shrink-0 w-36 sm:w-auto sm:flex-1 sm:max-w-sm">
            ${Icon('search', 'w-4 h-4 absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400')}
            <input id="top-search" data-change="set-search" placeholder="${SECTION_LABELS[state.leftSection]} içinde ara" value="${Utils.escapeHtml(state.search)}"
              class="w-full pl-8 pr-3 py-1.5 bg-gray-100 dark:bg-gray-800 rounded-lg text-sm border-0 focus:ring-2 focus:ring-blue-500 text-gray-900 dark:text-gray-100" />
          </div>
          <select data-change="set-period" class="flex-shrink-0 text-sm bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-200 rounded-lg px-2 py-1.5 border-0">
            <option value="all" ${state.period === 'all' ? 'selected' : ''}>Tüm zamanlar</option>
            <option value="today" ${state.period === 'today' ? 'selected' : ''}>Bugün</option>
            <option value="week" ${state.period === 'week' ? 'selected' : ''}>Bu hafta</option>
            <option value="month" ${state.period === 'month' ? 'selected' : ''}>Bu ay</option>
          </select>
          <button data-click="toggle-only-completed" class="flex-shrink-0 flex items-center gap-1.5 whitespace-nowrap text-sm px-2.5 py-1.5 rounded-lg border ${state.onlyCompleted ? 'bg-blue-600 border-blue-600 text-white' : 'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300'}">
            ${Icon('filter', 'w-3.5 h-3.5 flex-shrink-0')} <span class="hidden lg:inline">Yalnızca tamamlanan koçluklar</span><span class="lg:hidden">Tamamlanan</span>
          </button>
        ` : `<div class="flex-1"></div>`}
        <button data-click="toggle-theme" class="flex-shrink-0 p-2 rounded-lg text-gray-500 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800" title="Tema değiştir">
          ${Icon(theme === 'dark' ? 'sun' : 'moon', 'w-4 h-4')}
        </button>
        <div class="flex-shrink-0 flex items-center gap-2 pl-2 border-l hairline">
          <div class="w-7 h-7 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">${(state.currentUser?.name || '?').charAt(0).toUpperCase()}</div>
          <span class="hidden sm:block text-sm text-gray-700 dark:text-gray-200 whitespace-nowrap">${Utils.escapeHtml(state.currentUser?.name || '')}</span>
          <button data-click="logout" class="p-1.5 text-gray-400 hover:text-red-500" title="Çıkış Yap">${Icon('logOut', 'w-4 h-4')}</button>
        </div>
      </div>`;
  };

  /* ---------- Sol modül menüsü (iOS Ayarlar tarzı gruplandırılmış) ---------- */
  const renderSidebar = () => `
    <aside id="app-sidebar" class="w-64 flex-shrink-0 border-r hairline bg-gray-50/80 dark:bg-gray-950/80 ios-blur overflow-y-auto hidden md:flex md:flex-col">
      <div class="h-14 flex items-center gap-2 px-4 flex-shrink-0 border-b hairline">
        ${Icon('zap', 'w-5 h-5 text-emerald-500')}
        <div class="font-bold text-gray-900 dark:text-white text-sm leading-tight">PharmaInsight<br/><span class="font-normal text-gray-400 text-xs">Command Center</span></div>
      </div>
      <nav class="p-3 space-y-5 flex-1">
        ${SIDEBAR_GROUPS.map(group => `
          <div>
            <p class="px-2 mb-1 text-[11px] font-semibold uppercase tracking-wide text-gray-400 dark:text-gray-500">${group.label}</p>
            <div class="space-y-0.5">
              ${group.items.map(item => `
                <button data-click="select-section" data-key="${item.key}" class="w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-sm text-left ${state.leftSection === item.key ? 'bg-blue-600 text-white' : 'text-gray-700 dark:text-gray-200 hover:bg-gray-200/70 dark:hover:bg-gray-800'}">
                  ${Icon(item.icon, 'w-4 h-4 flex-shrink-0')}<span>${item.label}</span>
                </button>`).join('')}
            </div>
          </div>`).join('')}
      </nav>
    </aside>`;

  /* ---------- Kayıt bölümü: orta liste + sağ 360° detay ---------- */
  const getRecordList = () => {
    const kind = RECORD_SECTIONS[state.leftSection];
    let list = state.leftSection === 'temsilciler' ? Records.temsilciler()
      : state.leftSection === 'brickler' ? Records.brickler()
      : state.leftSection === 'doktorlar' ? Records.doktorlar()
      : Records.eczaneler();
    if (state.search.trim()) {
      const q = state.search.trim().toLowerCase();
      list = list.filter(r => (r.name || '').toLowerCase().includes(q) || (r.brick || '').toLowerCase().includes(q));
    }
    return { kind, list };
  };

  const renderCenterList = () => {
    const { list } = getRecordList();
    const hasSelection = !!state.selectedRecordId;
    return `
      <div class="${hasSelection ? 'hidden md:flex' : 'flex'} w-full md:w-80 flex-shrink-0 flex-col border-r hairline bg-white dark:bg-gray-900 overflow-y-auto">
        ${list.length === 0 ? `
          <div class="p-8 text-center text-sm text-gray-400">
            ${state.search ? 'Eşleşen kayıt yok.' : `Bu listede henüz kayıt yok. Bir GROW 360 koçluğunda görüşme kaydedildikçe burada görünecek.`}
          </div>` : list.map(r => `
          <button data-click="select-record" data-kind="${r.kind}" data-id="${Utils.escapeHtml(r.id)}" class="w-full text-left px-4 py-3 border-b hairline ${state.selectedRecordId === r.id ? 'bg-blue-50 dark:bg-blue-900/30' : 'hover:bg-gray-50 dark:hover:bg-gray-800/60'}">
            <div class="flex items-center justify-between">
              <span class="font-medium text-sm text-gray-900 dark:text-gray-100">${Utils.escapeHtml(r.name)}</span>
              ${Icon('chevronRight', 'w-4 h-4 text-gray-300 md:hidden')}
            </div>
            <p class="text-xs text-gray-400 mt-0.5">${_listMeta(r)}</p>
          </button>`).join('')}
      </div>`;
  };

  const _listMeta = (r) => {
    if (r.kind === 'temsilci') return `${r.sessionCount} koçluk · ${r.callCount} görüşme`;
    if (r.kind === 'brick') return `${r.callCount} görüşme · ${r.sessionCount} koçluk`;
    return `${r.brick || ''} · ${r.visitCount} ziyaret`;
  };

  const TABS = [
    { key: 'performans', label: 'Performans' },
    { key: 'ziyaret', label: 'Ziyaret' },
    { key: 'urun', label: 'Ürün' },
    { key: 'musteri', label: 'Müşteri' },
    { key: 'kocluk', label: 'Koçluk' },
  ];

  const _periodFilter = (isoDate) => {
    if (state.period === 'all' || !isoDate) return true;
    const d = new Date(isoDate);
    const now = new Date();
    if (state.period === 'today') return d.toDateString() === now.toDateString();
    if (state.period === 'week') { const diff = (now - d) / 86400000; return diff >= 0 && diff <= 7; }
    if (state.period === 'month') return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    return true;
  };

  const renderRightDetail = () => {
    if (!state.selectedRecordId) {
      return `<div class="hidden md:flex flex-1 items-center justify-center text-center p-10">
        <div>${Icon('userCircle', 'w-12 h-12 text-gray-200 dark:text-gray-700 mx-auto mb-3')}<p class="text-sm text-gray-400">Detayları görmek için soldan bir kayıt seçin.</p></div>
      </div>`;
    }
    const kind = state.selectedRecordKind, id = state.selectedRecordId;
    const list = getRecordList().list;
    const record = list.find(r => r.id === id) || { kind, id, name: id };
    const detail = Records.detailFor(kind, id);
    const badge = { temsilci: 'Temsilci', brick: 'Brick', doctor: 'Doktor', pharmacy: 'Eczane' }[kind];

    return `
      <div class="flex-1 flex flex-col overflow-hidden bg-gray-50 dark:bg-gray-950">
        <div class="flex items-center gap-2 px-4 py-3 border-b hairline bg-white dark:bg-gray-900">
          <button data-click="clear-selected-record" class="md:hidden p-1 -ml-1 text-gray-500">${Icon('chevronLeft', 'w-5 h-5')}</button>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <h2 class="font-bold text-gray-900 dark:text-white truncate">${Utils.escapeHtml(record.name)}</h2>
              <span class="text-[11px] px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400 flex-shrink-0">${badge}</span>
            </div>
            <p class="text-xs text-gray-400 truncate">${record.brick ? Utils.escapeHtml(record.brick) + ' · ' : ''}${record.branch ? Utils.escapeHtml(record.branch) : ''}</p>
          </div>
          ${kind === 'temsilci' ? `<button data-click="open-wizard-for-rep" data-rep-id="${record.id}" data-rep-name="${Utils.escapeHtml(record.name)}" class="flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-medium">${Icon('checkCircle', 'w-3.5 h-3.5')} GROW 360</button>` : ''}
        </div>

        <div class="flex-shrink-0 flex gap-1 px-4 py-2 border-b hairline bg-white dark:bg-gray-900 overflow-x-auto">
          ${TABS.map(t => `<button data-click="select-tab" data-tab="${t.key}" class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap ${state.activeTab === t.key ? 'bg-gray-900 dark:bg-white text-white dark:text-gray-900' : 'text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800'}">${t.label}</button>`).join('')}
        </div>

        <div class="flex-1 overflow-y-auto p-4">
          ${RecordsUI.renderTab(state.activeTab, kind, record, detail, _periodFilter)}
        </div>
      </div>`;
  };

  const renderRecordShell = () => `
    <div class="flex-1 flex overflow-hidden">${renderCenterList()}${renderRightDetail()}</div>`;

  const renderModuleShell = (contentHtml) => `
    <div class="flex-1 overflow-y-auto p-4 md:p-6">${contentHtml}</div>`;

  /* ---------- Ana çerçeve + GROW 360 sihirbaz kaplaması ---------- */
  const render = () => {
    const activeId = document.activeElement && document.activeElement.id;
    const selStart = activeId === 'top-search' ? document.activeElement.selectionStart : null;

    if (!state.currentUser) {
      root().innerHTML = Screens.login();
      renderToast();
      return;
    }

    const isRecord = !!RECORD_SECTIONS[state.leftSection];
    const bodyHtml = isRecord ? renderRecordShell() : renderModuleShell(Screens[state.leftSection] ? Screens[state.leftSection]() : Screens.dashboard());

    root().innerHTML = `
      <div class="h-screen flex flex-col md:flex-row bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100 overflow-hidden">
        ${renderSidebar()}
        <div class="flex-1 flex flex-col min-w-0">
          ${renderTopBar()}
          ${bodyHtml}
        </div>
      </div>
      ${state.wizardOpen ? `
        <div id="wizard-overlay" class="fixed inset-0 z-50 flex justify-end">
          <div data-click="close-wizard" class="absolute inset-0 bg-black/30"></div>
          <div class="relative w-full md:w-[94%] lg:w-[88%] h-full bg-gray-50 dark:bg-gray-950 shadow-2xl sheet-enter-active">
            ${Screens['coaching-engine']()}
          </div>
        </div>` : ''}`;

    if (activeId === 'top-search') {
      const el = document.getElementById('top-search');
      if (el) { el.focus(); if (selStart !== null) el.setSelectionRange(selStart, selStart); }
    }
    renderToast();
    if (typeof onRenderComplete === 'function') onRenderComplete();
  };

  const navigate = (route) => { state.leftSection = route; state.selectedRecordId = null; render(); };

  registerAction('select-section', (ds) => { state.leftSection = ds.key; state.selectedRecordKind = null; state.selectedRecordId = null; state.search = ''; render(); });
  registerAction('select-record', (ds) => { state.selectedRecordKind = ds.kind; state.selectedRecordId = ds.id; state.activeTab = 'performans'; render(); });
  registerAction('clear-selected-record', () => { state.selectedRecordId = null; render(); });
  registerAction('select-tab', (ds) => { state.activeTab = ds.tab; render(); });
  registerAction('set-search', (ds, ev) => { state.search = ev.target.value; render(); });
  registerAction('set-period', (ds, ev) => { state.period = ev.target.value; render(); });
  registerAction('toggle-only-completed', () => { state.onlyCompleted = !state.onlyCompleted; render(); });
  registerAction('toggle-sidebar', () => {
    const el = document.getElementById('app-sidebar');
    if (el) el.classList.toggle('hidden');
    if (el) el.classList.toggle('flex');
  });
  registerAction('toggle-theme', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.classList.toggle('dark', next === 'dark');
    Store.set(s => ({ ...s, settings: { ...s.settings, theme: next } }));
    render();
  });
  registerAction('logout', () => { state.currentUser = null; render(); });

  registerAction('open-wizard-for-rep', (ds) => {
    const existing = Store.get().coachingSessions
      .filter(s => s.status !== 'completed' && s.representative?.id === ds.repId)
      .sort((a, b) => (b.auditLog.at(-1)?.timestamp || '').localeCompare(a.auditLog.at(-1)?.timestamp || ''))[0];
    Wizard.reset();
    if (existing) {
      Wizard.state.session = existing;
    } else {
      Wizard.state.setup.representative = { id: ds.repId, name: ds.repName };
      if (state.currentUser.role === 'coach') Wizard.state.setup.manager = { id: state.currentUser.id, name: state.currentUser.name };
    }
    state.wizardOpen = true;
    render();
  });
  registerAction('close-wizard', () => { state.wizardOpen = false; render(); });
  registerAction('open-wizard-for-session', (ds) => {
    const s = Store.get().coachingSessions.find(x => x.id === ds.sessionId);
    if (!s) return;
    Wizard.reset();
    Wizard.state.session = s;
    state.wizardOpen = true;
    render();
  });

  const init = () => {
    Store.load();
    document.addEventListener('click', (ev) => {
      const el = ev.target.closest('[data-click]');
      if (!el) return;
      const action = el.getAttribute('data-click');
      if (Actions[action]) Actions[action](el.dataset, ev, el);
    });
    document.addEventListener('change', (ev) => {
      const el = ev.target.closest('[data-change]');
      if (!el) return;
      const action = el.getAttribute('data-change');
      if (Actions[action]) Actions[action](el.dataset, ev, el);
    });
    document.addEventListener('blur', (ev) => {
      const el = ev.target.closest ? ev.target.closest('[data-blur]') : null;
      if (!el) return;
      const action = el.getAttribute('data-blur');
      if (Actions[action]) Actions[action](el.dataset, ev, el);
    }, true);
    render();
  };

  return { state, registerAction, Actions, render, navigate, showToast, root, init, currentTheme, TABS };
})();
/* ============================================================
   RECORDS UI — 360° detay panelinin segmentli sekme içerikleri.
   Performans sekmesi Apple Health tarzı KPI kartları kullanır;
   CoachingEngine.CONTEXT_METRIC_DEFS'i yeniden kullanır (bu depoda
   IMS/pazar/ziyaret veri kaynağı yok, bu yüzden hepsi dürüstçe
   "Veri yok" gösterir — hiçbir sayı uydurulmaz).
   ============================================================ */
const RecordsUI = (() => {
  const kpiCard = (def) => `
    <div class="rounded-2xl border hairline bg-white dark:bg-gray-900 p-4">
      <div class="flex items-center justify-between mb-3">
        <div class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-400">${Icon('activity', 'w-4 h-4')}</div>
        <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-400">Bağlı değil</span>
      </div>
      <div class="text-2xl font-bold text-gray-300 dark:text-gray-600 mb-0.5">—</div>
      <div class="text-xs font-medium text-gray-600 dark:text-gray-300">${Utils.escapeHtml(def.label)}</div>
      <div class="text-[11px] text-gray-400 mt-1">${Utils.escapeHtml(def.unit)} · Veri yok</div>
    </div>`;

  const renderPerformans = () => `
    <div>
      <div class="flex items-start gap-2 bg-blue-50 dark:bg-blue-950/40 border border-blue-100 dark:border-blue-900 text-blue-800 dark:text-blue-300 text-xs rounded-xl p-3 mb-4">
        ${Icon('info', 'w-3.5 h-3.5 mt-0.5 flex-shrink-0')}
        <p>Bu uygulamada IMS/pazar/ziyaret veri kaynağı entegrasyonu yok; bu kartlar bilinçli olarak "Veri yok" gösteriyor. Ticari sonuçlar yalnızca bağlam olabilir, yetkinlik puanını otomatik belirlemez.</p>
      </div>
      <div class="grid grid-cols-2 lg:grid-cols-3 gap-3">${CoachingEngine.CONTEXT_METRIC_DEFS.map(kpiCard).join('')}</div>
    </div>`;

  const renderZiyaret = (kind, record, detail, periodFilter) => {
    const calls = detail.calls.filter(c => periodFilter(c.visitDateTime)).sort((a, b) => (b.visitDateTime || '').localeCompare(a.visitDateTime || ''));
    if (!calls.length) return _empty('Bu dönemde/kayıtta gözlenen görüşme yok.');
    return `<div class="space-y-2">${calls.map(c => `
      <div class="rounded-xl border hairline bg-white dark:bg-gray-900 p-3">
        <div class="flex items-center justify-between mb-1">
          <span class="text-sm font-medium text-gray-900 dark:text-gray-100">${kind === 'temsilci' || kind === 'brick' ? Utils.escapeHtml(c.customerName) : Utils.escapeHtml(c.representative?.name || '')}</span>
          <span class="text-xs text-gray-400">${c.visitDateTime ? Utils.formatDateTimeTR(c.visitDateTime) : 'Tarih yok'}</span>
        </div>
        <div class="flex flex-wrap gap-1.5 mb-1.5">
          <span class="text-[11px] px-1.5 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-500">${Utils.escapeHtml(c.brick || '')}</span>
          ${c.planned !== null ? `<span class="text-[11px] px-1.5 py-0.5 rounded-full ${c.planned ? 'bg-green-50 text-green-700 dark:bg-green-950 dark:text-green-400' : 'bg-orange-50 text-orange-700 dark:bg-orange-950 dark:text-orange-400'}">${c.planned ? 'Planlı' : 'Plansız'}</span>` : ''}
          ${c.productFocus ? `<span class="text-[11px] px-1.5 py-0.5 rounded-full bg-blue-50 text-blue-700 dark:bg-blue-950 dark:text-blue-400">${Utils.escapeHtml(c.productFocus)}</span>` : ''}
        </div>
        <p class="text-xs text-gray-500 dark:text-gray-400 line-clamp-2">${Utils.escapeHtml(c.observationNote || '')}</p>
      </div>`).join('')}</div>`;
  };

  const renderUrun = (detail) => {
    const entries = Object.entries(detail.products).sort((a, b) => b[1] - a[1]);
    if (!entries.length) return _empty('Bu kayıtta ürün/mesaj odağı girilmemiş.');
    const max = Math.max(...entries.map(e => e[1]));
    return `<div class="space-y-3">${entries.map(([name, count]) => `
      <div>
        <div class="flex justify-between text-xs mb-1"><span class="font-medium text-gray-700 dark:text-gray-200">${Utils.escapeHtml(name)}</span><span class="text-gray-400">${count}</span></div>
        <div class="h-2 rounded-full bg-gray-100 dark:bg-gray-800 overflow-hidden"><div class="h-full bg-blue-500 rounded-full" style="width:${(count / max) * 100}%"></div></div>
      </div>`).join('')}</div>`;
  };

  const renderMusteri = (kind, detail) => {
    const label = detail.relatedLabel;
    if (!detail.related.length) return _empty('Bu kayıt için ilişkili kayıt bulunamadı.');
    return `<p class="text-xs font-medium text-gray-400 mb-2">${label}</p><div class="space-y-2">${detail.related.map(r => `
      <div class="rounded-xl border hairline bg-white dark:bg-gray-900 p-3 flex items-center justify-between">
        <span class="text-sm text-gray-800 dark:text-gray-100">${Utils.escapeHtml(r.name)}</span>
        ${r.count ? `<span class="text-xs text-gray-400">${r.count} ziyaret</span>` : ''}
      </div>`).join('')}</div>`;
  };

  const renderKocluk = (kind, record, detail) => {
    if (kind === 'temsilci') {
      return `
        <div class="flex justify-end mb-3">
          <button data-click="open-wizard-for-rep" data-rep-id="${record.id}" data-rep-name="${Utils.escapeHtml(record.name)}" class="flex items-center gap-1.5 px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-medium">${Icon('plus', 'w-3.5 h-3.5')} Yeni Koçluk Başlat</button>
        </div>
        ${detail.sessions.length === 0 ? _empty('Bu temsilci için henüz koçluk kaydı yok.') : `
        <div class="space-y-2">${[...detail.sessions].sort((a, b) => (b.sessionDate || '').localeCompare(a.sessionDate || '')).map(s => `
          <button data-click="open-wizard-for-session" data-session-id="${s.id}" class="w-full text-left rounded-xl border hairline bg-white dark:bg-gray-900 p-3 hover:border-blue-300">
            <div class="flex items-center justify-between">
              <span class="text-sm font-medium text-gray-900 dark:text-gray-100">${Utils.formatDateTR(s.sessionDate)} · ${CoachingEngine.SESSION_TYPE_LABELS[s.sessionType]}</span>
              <span class="text-[11px] px-2 py-0.5 rounded-full ${s.status === 'completed' ? 'bg-green-50 text-green-700 dark:bg-green-950 dark:text-green-400' : 'bg-gray-100 text-gray-500 dark:bg-gray-800'}">${s.status}</span>
            </div>
            <p class="text-xs text-gray-400 mt-1">${s.observedCalls.length} görüşme · ${s.competencyRatings.filter(r => r.status !== 'not_assessed').length}/${CoachingEngine.COMPETENCY_CRITERIA.length} kriter · ${s.developmentGoals.length} hedef</p>
          </button>`).join('')}</div>`}`;
    }
    if (kind === 'brick') {
      if (!detail.sessions.length) return _empty('Bu brickte henüz koçluk kaydı yok.');
      return `<div class="space-y-2">${detail.sessions.map(s => `
        <div class="rounded-xl border hairline bg-white dark:bg-gray-900 p-3">
          <div class="flex items-center justify-between">
            <span class="text-sm font-medium text-gray-900 dark:text-gray-100">${Utils.escapeHtml(s.representative?.name || '')} · ${Utils.formatDateTR(s.sessionDate)}</span>
            <span class="text-[11px] px-2 py-0.5 rounded-full ${s.status === 'completed' ? 'bg-green-50 text-green-700' : 'bg-gray-100 text-gray-500'}">${s.status}</span>
          </div>
        </div>`).join('')}</div>`;
    }
    // doctor / pharmacy: yalnızca bu müşteriyle ilgili görüşmelerde kanıt gösterilen değerlendirmeler (salt okunur)
    if (!detail.competencyEvidence.length) return _empty('Bu müşteriyle ilgili görüşmelerde henüz yetkinlik kanıtı işaretlenmedi.');
    return `<div class="space-y-2">${detail.competencyEvidence.map(r => `
      <div class="rounded-xl border hairline bg-white dark:bg-gray-900 p-3">
        <div class="flex items-center justify-between mb-1">
          <span class="text-sm font-medium text-gray-900 dark:text-gray-100">${CoachingEngine.labelFor(r.criterionId)}</span>
          <span class="text-xs font-bold ${r.classification === 'strength' ? 'text-green-600' : r.classification === 'development' ? 'text-orange-600' : 'text-blue-600'}">${r.score ?? '—'}</span>
        </div>
        <p class="text-xs text-gray-500 dark:text-gray-400">${Utils.escapeHtml(r.evidenceNote || '')}</p>
        <p class="text-[11px] text-gray-400 mt-1">${Utils.escapeHtml(r.representative?.name || '')} tarafından koçluk edildi</p>
      </div>`).join('')}</div>`;
  };

  const _empty = (msg) => `<div class="text-center py-10 text-sm text-gray-400">${Utils.escapeHtml(msg)}</div>`;

  const renderTab = (tab, kind, record, detail, periodFilter) => {
    if (tab === 'performans') return renderPerformans();
    if (tab === 'ziyaret') return renderZiyaret(kind, record, detail, periodFilter);
    if (tab === 'urun') return renderUrun(detail);
    if (tab === 'musteri') return renderMusteri(kind, detail);
    return renderKocluk(kind, record, detail);
  };

  return { renderTab };
})();

/* ============================================================
   SELF EXPORT — bu HTML dosyasının, o anki verileri içine gömülü
   olarak taşıyan yeni bir kopyasını üretir ve indirir.
   Şablonda `window.__SEED_DATA__ = null;` satırını arar ve o anki
   Store verisiyle değiştirir (bkz. index.html'deki #seed-data-slot).
   ============================================================ */
const SelfExport = (() => {
  const PLACEHOLDER = 'window.__SEED_DATA__ = null;';

  const buildHtml = () => {
    const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    // "</" dizisini kaçışlıyoruz; aksi halde bir metin alanına yazılmış
    // kapatma script etiketi gömülü veriyi bozup dosyayı kırabilir.
    const safeJson = Store.exportAll().replace(/<\//g, '<\\/');
    const seedAssignment = 'window.__SEED_DATA__ = ' + safeJson + ';';
    if (!fullHtml.includes(PLACEHOLDER)) {
      // Zaten gömülü veri varsa (bu dosya daha önce bir kez indirilmişse) o satırı
      // güncel veriyle değiştir.
      return fullHtml.replace(/window\.__SEED_DATA__\s*=\s*[\s\S]*?;\s*(?=<\/script>)/, seedAssignment + '\n');
    }
    return fullHtml.replace(PLACEHOLDER, seedAssignment);
  };

  const download = () => {
    const html = buildHtml();
    Utils.downloadBlob(html, 'PharmaInsight_Command_Center_GROW360.html', 'text/html;charset=utf-8');
    App.showToast('Güncel HTML indirildi. Bu kopya verilerinizi içinde taşır.', 'success');
  };

  return { download, buildHtml, PLACEHOLDER };
})();

const _rotaMatch = (text) => {
  const lower = text.toLowerCase();
  const baslik = Object.keys(ROTA_BASLIKLAR).find(b => lower.includes(b.toLowerCase())) || '';
  const seviye = Object.keys(DEGERLENDIRME_SEVIYELERI).find(sv => lower.includes(sv.toLowerCase())) || '';
  return { baslik, seviye };
};

const _localRotaResponse = (baslik, seviye, userText) => {
  if (!baslik || !ROTA_BASLIKLAR[baslik]) {
    return "Yerel öneri (AI anahtarı girilmedi): Bir ROTA başlığı ve seviye seçerseniz, o başlığa özel NASIL adımlarını ve örnek SMART hedefi burada gösterebilirim.";
  }
  const t = ROTA_BASLIKLAR[baslik];
  const sev = DEGERLENDIRME_SEVIYELERI[seviye] || DEGERLENDIRME_SEVIYELERI['Başarılı'];
  return [
    `Yerel öneri (AI anahtarı girilmedi) — "${baslik}" / ${seviye || 'seviye belirtilmedi'}`,
    ``,
    `Yaklaşım: ${sev.yaklasim}`,
    ``,
    `NASIL 1: ${t.nasil_1}`,
    `NASIL 2: ${t.nasil_2}`,
    `NASIL 3: ${t.nasil_3}`,
    ``,
    `Ölçüm: ${t.olcum}`,
    `Örnek SMART hedef: ${t.hedef_ornek}`,
  ].join('\n');
};

const _openAiChat = async (apiKey, systemPrompt, userText) => {
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
    body: JSON.stringify({
      model: 'gpt-4o-mini',
      messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userText }],
      temperature: 0.7,
    }),
  });
  if (!res.ok) throw new Error(`OpenAI API hata: ${res.status}`);
  const data = await res.json();
  return data.choices?.[0]?.message?.content || '(boş yanıt)';
};

const _rotaSystemPrompt = () => `Sen uzman bir ROTA koçusun. İlaç sektöründe satış temsilcilerine koçluk yapıyorsun.
ROTA Verimlilik Başlıkları ve NASIL Metodolojisi:
${JSON.stringify(ROTA_BASLIKLAR)}
Değerlendirme Seviyeleri:
${JSON.stringify(DEGERLENDIRME_SEVIYELERI)}
Öğrenme Stilleri:
${JSON.stringify(OGRENME_STILLERI)}
Ürünlerimiz: Sidefer, Cistus Antivirüs Pastil, Dalincare Atocure, Tümformlar
Branşlarımız: Pediatri, Dermatoloji, Kadın Doğum + Eczaneler
GÖREV: Kullanıcının mesajını analiz et; seçilen başlık/seviyeye özel NASIL adımları, SMART hedefler ve motive edici, Türkçe bir yanıt ver.`;

App.registerAction('chat-quick', (ds) => {
  document.getElementById('chat-topic').value = ds.topic;
  document.getElementById('chat-input').value = `Başlık: ${ds.topic}`;
  App.Actions['chat-send']();
});

App.registerAction('chat-send', async () => {
  const input = document.getElementById('chat-input');
  const topicSel = document.getElementById('chat-topic').value;
  const levelSel = document.getElementById('chat-level').value;
  const text = input.value.trim();
  if (!text && !topicSel) return;
  const user = App.state.currentUser;
  const finalText = text || `Başlık: ${topicSel}, Seviye: ${levelSel}`;
  const matched = _rotaMatch(finalText);
  const baslik = topicSel || matched.baslik;
  const seviye = levelSel || matched.seviye;

  Store.set(s => ({ ...s, rotaSessions: [...s.rotaSessions, { id: Utils.uid(), userId: user.id, role: 'user', content: finalText, baslik, seviye, timestamp: Utils.nowIso() }] }));
  App.render();
  const scroll = document.getElementById('chat-scroll');
  if (scroll) scroll.scrollTop = scroll.scrollHeight;

  const apiKey = Store.get().settings?.aiApiKey;
  let responseText;
  try {
    responseText = apiKey
      ? await _openAiChat(apiKey, _rotaSystemPrompt(), finalText)
      : _localRotaResponse(baslik, seviye, finalText);
  } catch (e) {
    console.error('AI chat error:', e);
    responseText = 'AI yanıtı alınamadı (' + e.message + '). Yerel öneriye geçiliyor.\n\n' + _localRotaResponse(baslik, seviye, finalText);
  }

  Store.set(s => ({ ...s, rotaSessions: [...s.rotaSessions, { id: Utils.uid(), userId: user.id, role: 'ai', content: responseText, baslik, seviye, timestamp: Utils.nowIso() }] }));
  App.render();
  const scroll2 = document.getElementById('chat-scroll');
  if (scroll2) scroll2.scrollTop = scroll2.scrollHeight;
});

   /coaching-areas, /products, /branches, /rota/verimlilik/topics hiç

const AssessUI = { tab: 'quick', quick: { area: '', strengths: [], improvements: [], score: 75 }, pb: { area: '', product: '', branch: '', strengths: [], improvements: [], score: 75 }, verim: { topics: [], levels: {} } };

const _perfColor = (score) => score >= 90 ? 'bg-green-500' : score >= 75 ? 'bg-blue-500' : score >= 60 ? 'bg-yellow-500' : 'bg-red-500';
const _perfText = (score) => score >= 90 ? 'Mükemmel' : score >= 75 ? 'İyi' : score >= 60 ? 'Gelişiyor' : 'Destek Gerekli';

const _localAssessmentFeedback = (areaLabel, strengths, improvements, score) => {
  const parts = [];
  parts.push(`${areaLabel} alanında öz değerlendirme puanı: ${score}/100 (${_perfText(score)}).`);
  if (strengths.length) parts.push(`Güçlü yönler olarak şunlar işaretlendi: ${strengths.join(', ')}.`);
  if (improvements.length) parts.push(`Gelişim alanı olarak şunlar işaretlendi: ${improvements.join(', ')}. Bir sonraki saha gününde bu becerilerden birini gözlemli bir görüşmede uygulayıp GROW 360 koçluğunda kanıtla birlikte kaydetmeniz önerilir.`);
  return parts.join(' ');
};

      const next = Utils.clamp(g.current_value + Number(ds.delta), 0, g.target_value);
      return { ...g, current_value: next, status: next >= g.target_value ? 'completed' : 'active' };
    }),
  }));
  App.render();
});

App.registerAction('goal-progress-prompt', (ds) => {
  const goal = Store.get().goals.find(g => g.id === ds.id);

  const val = window.prompt(`Yeni ilerleme değeri (0-${goal.target_value}):`, goal.current_value);

/* Adım 4 (yetkinlikler) 34 satırlık toplu bir taslak tutar; başka bir
   adıma geçmeden önce kaydedilmesi gerekir (React sürümündeki
   goToStep() otomatik kaydetme davranışının karşılığı). */
Wizard.saveCurrentStepIfNeeded = () => {
  const st = Wizard.state;
  if (st.step === 4 && st.session) return Wizard.saveStep4();
  return true;
};

App.registerAction('wizard-goto', (ds) => {
  const target = Number(ds.step);
  if (target < 1 || target > 8) return;
  if (target > 1 && !Wizard.state.session) return;
  if (!Wizard.saveCurrentStepIfNeeded()) return;
  Wizard.state.step = target;
  App.render();
});

App.registerAction('wizard-next', () => {
  const st = Wizard.state;
  if (st.step === 1 && !st.session) {
    Wizard.createSessionFromSetup();
    return;
  }
  if (!Wizard.saveCurrentStepIfNeeded()) return;
  if (st.step < 8) { st.step += 1; App.render(); }
});

Wizard.createSessionFromSetup = () => {
  const st = Wizard.state;
  const setup = st.setup;
  if (!setup.representative?.id || !setup.manager?.name?.trim() || !setup.sessionDate || !setup.sessionType) {
    App.showToast('Temsilci, yönetici, tarih ve koçluk türü zorunludur.', 'error');
    return;
  }
  const session = CoachingEngine.createSession(setup, App.state.currentUser.name);
  st.session = session;
  st.step = 2;
  App.showToast('Koçluk kaydı oluşturuldu.', 'success');
  App.render();
};

Wizard.persist = (patch) => {
  const st = Wizard.state;
  const res = CoachingEngine.updateSession(st.session.id, patch, App.state.currentUser.name);
  if (!res.ok) {
    App.showToast(res.errors[0] || 'Kaydedilemedi.', 'error');
    return false;
  }
  st.session = res.value;
  st.saveMsg = 'Kaydedildi ✓';
  setTimeout(() => { Wizard.state.saveMsg = ''; }, 2000);
  return true;
};

const _mutateSetup = (mutator) => {
  const st = Wizard.state;
  if (st.session) {
    const patch = mutator(st.session);
    Wizard.persist(patch);
    App.render();
  } else {
    Object.assign(st.setup, mutator(st.setup));
    App.render();
  }
};

App.registerAction('w-set-representative', (ds, ev) => {
  const u = Store.get().users.find(x => x.id === ev.target.value);
  _mutateSetup(() => ({ representative: u ? { id: u.id, name: u.name } : null }));
});
App.registerAction('w-set-manager-list', (ds, ev) => {
  const u = Store.get().users.find(x => x.id === ev.target.value);
  if (!u) return;
  _mutateSetup(() => ({ manager: { id: u.id, name: u.name } }));
});
App.registerAction('w-set-manager-name', (ds, ev) => {
  const st = Wizard.state;
  const currentManager = (st.session || st.setup).manager || {};
  _mutateSetup(() => ({ manager: { ...currentManager, name: ev.target.value } }));
});
App.registerAction('w-set-field', (ds, ev) => { _mutateSetup(() => ({ [ds.field]: ev.target.value || null })); });
App.registerAction('w-add-brick', () => {
  const input = document.getElementById('w-brick-input');
  const v = input.value.trim();
  if (!v) return;
  const st = Wizard.state;
  Wizard.state.brickInput = '';
  const currentBricks = (st.session || st.setup).bricks || [];
  if (currentBricks.includes(v)) { App.render(); return; }
  _mutateSetup(() => ({ bricks: [...currentBricks, v] }));
});
App.registerAction('w-remove-brick', (ds) => {
  const st = Wizard.state;
  const currentBricks = (st.session || st.setup).bricks || [];
  _mutateSetup(() => ({ bricks: currentBricks.filter(b => b !== ds.brick) }));
});
App.registerAction('w-toggle-focus', (ds) => {
  const st = Wizard.state;
  const current = (st.session || st.setup).focusCompetencies || [];
  const has = current.includes(ds.id);
  _mutateSetup(() => ({ focusCompetencies: has ? current.filter(x => x !== ds.id) : [...current, ds.id] }));
});

/* ============================================================
   ADIM 4 — Yetkinlik profili (Step4Competencies.js karşılığı)
   34 kriter, kategori bazlı katlanır bölümler. Satır değişiklikleri
   önce yerel taslakta (Wizard.state.ratingDrafts) tutulur; adımdan
   çıkarken veya "Kaydet"e basılınca toplu doğrulanıp Store'a yazılır.
   ============================================================ */
const _emptyRatingDraft = (criterionId) => ({ criterionId, score: null, status: 'not_assessed', evidenceCallIds: [], evidenceNote: '' });

Wizard.ensureRatingDrafts = (session) => {
  if (!Wizard.state.ratingDrafts) {
    const map = {};
    CoachingEngine.COMPETENCY_CRITERIA.forEach(c => {
      const existing = session.competencyRatings.find(r => r.criterionId === c.id);
      map[c.id] = existing ? { ...existing, evidenceNote: existing.evidenceNote || '' } : _emptyRatingDraft(c.id);
    });
    Wizard.state.ratingDrafts = map;
  }
  return Wizard.state.ratingDrafts;
};

const _classificationLabel = (status, score) => {
  if (status !== 'observed' && status !== 'partly_observed') return CoachingEngine.CLASSIFICATION_LABELS.not_assessed;
  return CoachingEngine.CLASSIFICATION_LABELS[CoachingEngine.classificationForScore(score)];
};
const _classificationColor = (status, score) => {
  if (status !== 'observed' && status !== 'partly_observed' || score === null) return 'bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400';
  const c = CoachingEngine.classificationForScore(score);
  return c === 'strength' ? 'bg-green-100 text-green-700' : c === 'expected' ? 'bg-blue-100 text-blue-700' : 'bg-orange-100 text-orange-700';
};

Wizard.renderStep4 = (session) => {
  const drafts = Wizard.ensureRatingDrafts(session);
  const calls = session.observedCalls;
  return `
    <div class="space-y-4">
      <div class="bg-amber-50 dark:bg-amber-950/40 border border-amber-200 text-amber-800 text-sm rounded-lg p-3">
        3 puan "Beklenen düzey"dir ve gelişim alanı sayılmaz. Boş kriterler otomatik 3 yapılmaz. 1, 2, 4 ve 5 puan kanıtsız kaydedilemez.
      </div>
      <div class="flex justify-end">
        <button data-click="w-ratings-save" class="px-4 py-2 bg-gray-900 text-white rounded-lg text-sm font-medium flex items-center gap-2">${Icon('save', 'w-4 h-4')} Yetkinlikleri Kaydet</button>
      </div>
      ${CoachingEngine.COMPETENCY_CATEGORIES.map(cat => `
        <div class="bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-xl overflow-hidden">
          <button data-click="w-cat-toggle" data-cat="${cat.id}" class="w-full flex items-center justify-between p-3 text-left">
            <span class="font-semibold text-gray-800 dark:text-gray-100 text-sm">${cat.id}. ${cat.label}</span>
            ${Icon('chevronDown', 'w-4 h-4 text-gray-400 dark:text-gray-500')}
          </button>
          <div id="cat-body-${cat.id}" class="p-3 pt-0 space-y-2">
            ${CoachingEngine.COMPETENCY_CRITERIA.filter(c => c.category === cat.id).map(c => _ratingRow(c, drafts[c.id], calls)).join('')}
          </div>
        </div>`).join('')}
    </div>`;
};

const _ratingRow = (criterion, rating, calls) => {
  const scoreAllowed = rating.status === 'observed' || rating.status === 'partly_observed';
  const needsEvidence = scoreAllowed && [1, 2, 4, 5].includes(rating.score);
  const missingEvidence = needsEvidence && (!rating.evidenceNote?.trim() || !rating.evidenceCallIds.length);
  return `
    <div class="border border-gray-200 dark:border-gray-800 rounded-lg p-3 bg-white dark:bg-gray-900" data-rating-row="${criterion.id}">
      <div class="flex items-start justify-between gap-3 mb-2">
        <div><span class="text-xs font-mono text-gray-400 dark:text-gray-500 mr-2">${criterion.id}</span><span class="text-sm text-gray-900 dark:text-white">${Utils.escapeHtml(criterion.label)}</span></div>
        <span class="text-xs px-2 py-0.5 rounded-full font-medium whitespace-nowrap ${_classificationColor(rating.status, rating.score)}">${_classificationLabel(rating.status, rating.score)}</span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Durum</label>
          <select data-change="w-rating-status" data-id="${criterion.id}" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-sm">
            ${Object.entries(CoachingEngine.RATING_STATUS_LABELS).map(([k, v]) => `<option value="${k}" ${rating.status === k ? 'selected' : ''}>${v}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Puan (1-5)</label>
          <select data-change="w-rating-score" data-id="${criterion.id}" ${scoreAllowed ? '' : 'disabled'} class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-sm disabled:bg-gray-100">
            <option value="">Puan yok</option>
            ${[1, 2, 3, 4, 5].map(s => `<option value="${s}" ${rating.score === s ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
      ${scoreAllowed && rating.score !== null ? `
        <div class="mt-2 space-y-2">
          <div>
            <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Bağlanmış görüşme kanıtı ${needsEvidence ? '<span class="text-red-500">*</span>' : ''}</label>
            <div class="flex flex-wrap gap-1.5">
              ${calls.length === 0 ? '<span class="text-xs text-gray-400 dark:text-gray-500">Önce Adım 3\'te görüşme ekleyin.</span>' : calls.map(c => `<button data-click="w-rating-toggle-evidence" data-id="${criterion.id}" data-call="${c.id}" class="text-xs px-2 py-1 rounded-full border ${rating.evidenceCallIds.includes(c.id) ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white dark:bg-gray-900 border-gray-300 dark:border-gray-700 text-gray-600 dark:text-gray-300'}">${Utils.escapeHtml(c.customerName)} · ${Utils.escapeHtml(c.brick)}</button>`).join('')}
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Yönetici kanıt notu ${needsEvidence ? '<span class="text-red-500">*</span>' : ''}</label>
            <textarea data-blur="w-rating-note" data-id="${criterion.id}" rows="2" placeholder="Gözlenen somut davranışı yazın." class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-sm">${Utils.escapeHtml(rating.evidenceNote || '')}</textarea>
          </div>
          ${missingEvidence ? `<div class="flex items-center gap-1.5 text-xs text-red-600">${Icon('alertTriangle', 'w-3.5 h-3.5')} ${rating.score} puan kanıt (görüşme + not) olmadan kaydedilemez.</div>` : ''}
        </div>` : ''}
    </div>`;
};

Wizard.saveStep4 = () => {
  const drafts = Wizard.state.ratingDrafts;
  if (!drafts) return true;
  const ratings = [];
  for (const criterionId of Object.keys(drafts)) {
    const res = CoachingEngine.createCompetencyRating(drafts[criterionId]);
    if (!res.ok) { App.showToast(res.errors[0], 'error'); return false; }
    ratings.push(res.value);
  }
  const ok = Wizard.persist({ competencyRatings: ratings });
  if (ok) App.showToast('Yetkinlikler kaydedildi.', 'success');
  return ok;
};
